<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" role="img" aria-label="Contribution streak: 23 day current streak, 23 day longest streak, 1,325 total contributions">
  
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#a855f7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
    .fade { opacity:0; animation: fade .6s ease-out both; }
    .rise { opacity:0; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; }
    .ring { animation: ring 1.3s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes fade { to { opacity:1 } }
    @keyframes rise { from { opacity:0; transform: translateY(9px) } to { opacity:1; transform: translateY(0) } }
    @keyframes grow { from { transform: scaleX(0) } }
    @keyframes ring { from { stroke-dashoffset: 233 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important } }
  </style>
  <rect width="820" height="190" rx="14" fill="#0b0c10"/>
  <rect width="820" height="190" rx="14" fill="rgba(255,255,255,0.028)"/>
  <rect x=".75" y=".75" width="818.5" height="188.5" rx="13.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <text class="mono fade" x="24" y="34" font-size="10.5" letter-spacing="1.6" fill="#22d3ee">CONTRIBUTION STREAK</text>

  <line x1="273" y1="56" x2="273" y2="158" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="546" y1="56" x2="546" y2="158" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  
  <text class="mono rise" x="137" y="88" font-size="34" font-weight="700" fill="#ededf0" text-anchor="middle" style="animation-delay:0.3s">1,325</text>
  <text class="mono fade" x="137" y="124" font-size="10.5" letter-spacing="1.5" fill="#22d3ee" text-anchor="middle" style="animation-delay:0.4s">TOTAL CONTRIBUTIONS</text>
  <text class="mono fade" x="137" y="146" font-size="9.5" fill="#9ba0ab" text-anchor="middle" style="animation-delay:0.44999999999999996s">Aug 30, 2022 → now</text>

  <circle class="fade" cx="410" cy="74" r="37" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" style="animation-delay:.4s"/>
  <circle class="ring" cx="410" cy="74" r="37" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="233" stroke-dashoffset="0" transform="rotate(-90 410 74)" style="animation-delay:.5s"/>
  
  <text class="mono rise" x="410" y="88" font-size="34" font-weight="700" fill="#ededf0" text-anchor="middle" style="animation-delay:0.45s">23</text>
  <text class="mono fade" x="410" y="124" font-size="10.5" letter-spacing="1.5" fill="#22d3ee" text-anchor="middle" style="animation-delay:0.55s">CURRENT STREAK</text>
  <text class="mono fade" x="410" y="146" font-size="9.5" fill="#9ba0ab" text-anchor="middle" style="animation-delay:0.6s">Aug 4, 2026 → Aug 26, 2026</text>

  
  <text class="mono rise" x="683" y="88" font-size="34" font-weight="700" fill="#ededf0" text-anchor="middle" style="animation-delay:0.6s">23</text>
  <text class="mono fade" x="683" y="124" font-size="10.5" letter-spacing="1.5" fill="#22d3ee" text-anchor="middle" style="animation-delay:0.7s">LONGEST STREAK</text>
  <text class="mono fade" x="683" y="146" font-size="9.5" fill="#9ba0ab" text-anchor="middle" style="animation-delay:0.75s">Aug 4, 2026 → Aug 26, 2026</text>

  <rect class="grow" x="24" y="186" width="140" height="2" rx="1" fill="url(#rule)" style="animation-delay:1s"/>
</svg>
