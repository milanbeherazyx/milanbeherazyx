<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'General Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif" role="img" aria-label="Milan Kumar Behera — Data Analyst, Lending &amp; Credit Risk. Messy data, turned into decisions.">
  <defs>
    <linearGradient id="gText" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset=".55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x2" values="520;760;520" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="gBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#a855f7" stop-opacity=".25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".7"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
    .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
    .fade { animation: fade .8s ease-out both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
    .pop  { transform-box: fill-box; transform-origin: center; animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .flow { animation: dash 6s linear infinite; }
    .drift-a { animation: driftA 16s ease-in-out infinite; }
    .drift-b { animation: driftB 20s ease-in-out infinite; }
    .d1{animation-delay:.05s}.d2{animation-delay:.16s}.d3{animation-delay:.28s}.d4{animation-delay:.45s}
    .d5{animation-delay:.6s}.d6{animation-delay:.75s}.d7{animation-delay:.95s}.d8{animation-delay:1.15s}
    .d9{animation-delay:1.35s}.d10{animation-delay:1.7s}
    .p2{animation-delay:.7s}.p3{animation-delay:1.4s}.p4{animation-delay:2.1s}.p5{animation-delay:2.6s}
    @keyframes rise { from { opacity:0; transform: translateY(16px); } }
    @keyframes fade { from { opacity:0; } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes pop  { 0% { opacity:0; transform: scale(.5); } 70% { transform: scale(1.12); } 100% { opacity:1; transform: scale(1); } }
    @keyframes pulse { 0%,100% { opacity:.25; } 50% { opacity:1; } }
    @keyframes dash { to { stroke-dashoffset: -120; } }
    @keyframes driftA { 0%,100% { transform: translate(0,0); } 50% { transform: translate(48px,-22px); } }
    @keyframes driftB { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-40px,26px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#0b0c10"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- ambient glow field -->
    <ellipse class="drift-a" cx="920" cy="40" rx="300" ry="150" fill="#6366f1" opacity=".14" filter="url(#blur)"/>
    <ellipse class="drift-b" cx="1130" cy="400" rx="260" ry="150" fill="#a855f7" opacity=".12" filter="url(#blur)"/>
    <ellipse class="drift-b" cx="180" cy="430" rx="240" ry="120" fill="#22d3ee" opacity=".06" filter="url(#blur)"/>

    <!-- data constellation -->
    <g stroke="#6366f1" stroke-opacity=".3" stroke-width="1" fill="none">
      <path class="flow" d="M620 84 L700 46 L788 92 L866 40" stroke-dasharray="4 7"/>
      <path class="flow" d="M700 46 L760 120" stroke-dasharray="3 8"/>
    </g>
    <g fill="#22d3ee">
      <circle class="pulse"    cx="620" cy="84"  r="3"/>
      <circle class="pulse p2" cx="700" cy="46"  r="2.5"/>
      <circle class="pulse p3" cx="788" cy="92"  r="3"/>
      <circle class="pulse p4" cx="866" cy="40"  r="2.5"/>
      <circle class="pulse p5" cx="760" cy="120" r="2" fill="#a855f7"/>
      <circle class="pulse p3" cx="1148" cy="70" r="2.5" fill="#818cf8"/>
      <circle class="pulse p2" cx="1104" cy="330" r="2.5"/>
      <circle class="pulse p4" cx="580" cy="300" r="2" fill="#818cf8"/>
    </g>

    <!-- eyebrow -->
    <text class="mono fade" x="64" y="86" font-size="13" letter-spacing="2.5" fill="#22d3ee">MILAN KUMAR BEHERA — DATA ANALYST · LENDING &amp; CREDIT RISK</text>

    <!-- headline -->
    <g font-weight="800" font-size="58" letter-spacing="-1.5">
      <text class="rise d1" x="62" y="154" fill="#ededf0">Messy data,</text>
      <text class="rise d2" x="62" y="218" fill="#ededf0">turned into</text>
      <text class="rise d3" x="62" y="282" fill="url(#gText)">decisions.</text>
    </g>

    <!-- toolkit -->
    <text class="mono rise d4" x="64" y="330" font-size="15" fill="#9ba0ab">python · sql/snowflake · tableau · power bi · funnels &amp; rca · ml</text>

    <!-- status chip -->
    <g class="fade d5">
      <rect x="64" y="352" width="238" height="34" rx="17" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".35"/>
      <circle class="pulse" cx="86" cy="369" r="4" fill="#22d3ee"/>
      <text class="mono" x="100" y="374" font-size="13" fill="#22d3ee">open_to: leads &amp; roles</text>
    </g>

    <!-- funnel ledger -->
    <g transform="translate(742,186)">
      <text class="mono fade d5" x="0" y="0" font-size="12" letter-spacing="2" fill="#9ba0ab">PORTFOLIO QUALIFICATION RATE</text>

      <!-- before -->
      <text class="mono fade d6" x="0" y="42" font-size="12" fill="#9ba0ab">before</text>
      <rect x="64" y="28" width="280" height="18" rx="4" fill="#ffffff" fill-opacity=".06"/>
      <rect class="grow d6" x="64" y="28" width="84" height="18" rx="4" fill="#818cf8" fill-opacity=".45"/>
      <text class="mono fade d7" x="354" y="42" font-size="14" fill="#ededf0">30%</text>

      <!-- after -->
      <text class="mono fade d7" x="0" y="80" font-size="12" fill="#9ba0ab">after</text>
      <rect x="64" y="66" width="280" height="18" rx="4" fill="#ffffff" fill-opacity=".06"/>
      <rect class="grow d7" x="64" y="66" width="120" height="18" rx="4" fill="url(#gBar)"/>
      <text class="mono fade d8" x="354" y="80" font-size="14" font-weight="700" fill="#22d3ee">43%</text>

      <!-- caption -->
      <text class="mono fade d9" x="0" y="118" font-size="11" fill="#9ba0ab">6 lenders · 100K+ borrowers / month</text>

      <!-- +13 pts stamp -->
      <g transform="translate(262,102) rotate(-6)">
        <g class="pop d10">
          <rect x="0" y="0" width="96" height="32" rx="7" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-width="1.5"/>
          <text class="mono" x="48" y="21" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">+13 pts</text>
        </g>
      </g>
    </g>

    <!-- gradient hairline frame -->
    <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="url(#gBorder)" stroke-opacity=".45" stroke-width="1.5"/>
  </g>
</svg>
