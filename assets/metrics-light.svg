<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" font-family="'General Sans',-apple-system,'Segoe UI',Roboto,Arial,sans-serif" role="img" aria-label="30% to 43% portfolio qualification rate lifted · ₹8–9B+ loan book exposure monitored · 80% of manual vendor reviews eliminated">
  <defs>
    <linearGradient id="mBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="mEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#a855f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="mRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6366f1" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".3"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mTiles">
      <rect x="0"   y="0" width="386" height="160" rx="14"/>
      <rect x="407" y="0" width="386" height="160" rx="14"/>
      <rect x="814" y="0" width="386" height="160" rx="14"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace,'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; font-variant-numeric: tabular-nums; }
    .fade { opacity:0; animation: fade .6s ease-out both; }
    .rise { opacity:0; animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .tick { opacity:0; animation: tick .1s linear both; }
    .grow { transform-box: fill-box; transform-origin: left center; animation: grow .8s cubic-bezier(.2,.7,.2,1) both; }
    .draw { animation: draw 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) both; }
    .sheen { animation: sheen 7s ease-in-out infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .t2 { animation-delay:.12s } .t3 { animation-delay:.24s }
    @keyframes fade { from { opacity:0 } to { opacity:1 } }
    @keyframes rise { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform: translateY(0) } }
    @keyframes tick { 0%{opacity:0} 6%{opacity:1} 94%{opacity:1} 100%{opacity:0} }
    @keyframes grow { from { transform: scaleX(0) } }
    @keyframes draw { from { stroke-dashoffset: 420 } to { stroke-dashoffset: 0 } }
    @keyframes ring { from { stroke-dashoffset: 138.2 } to { stroke-dashoffset: 27.6 } }
    @keyframes sheen { 0% { transform: translateX(-460px) } 55%,100% { transform: translateX(1420px) } }
    @keyframes pulse { 0%,100% { opacity:.3 } 50% { opacity:1 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
      .tick { opacity: 0 !important; }
      .ring { stroke-dashoffset: 27.6 !important; }
    }
  </style>

  <!-- ── TILE 1 · qualification lift ───────────────────────── -->
  <g>
    <rect class="fade" x="0" y="0" width="386" height="160" rx="14" fill="#101116" fill-opacity=".022"/>
    <rect class="fade" x=".75" y=".75" width="384.5" height="158.5" rx="13.25" fill="none" stroke="url(#mEdge)" stroke-width="1.5"/>

    <text class="mono fade" x="26" y="40" font-size="10.5" letter-spacing="1.6" fill="#0e7490">01 / FUNNEL</text>

    <g class="mono" font-size="34" font-weight="700">
      <text class="rise" x="26" y="84" fill="#4d5361" style="animation-delay:.3s">30%</text>
      <text class="rise" x="98" y="84" fill="#4d5361" style="animation-delay:.38s">→</text>
      <text class="tick" x="140" y="84" fill="#0e7490" style="animation-delay:.50s">33%</text>
      <text class="tick" x="140" y="84" fill="#0e7490" style="animation-delay:.60s">36%</text>
      <text class="tick" x="140" y="84" fill="#0e7490" style="animation-delay:.70s">39%</text>
      <text class="tick" x="140" y="84" fill="#0e7490" style="animation-delay:.80s">41%</text>
      <text class="fade" x="140" y="84" fill="#0e7490" style="animation-delay:.90s">43%</text>
    </g>

    <g class="mono" font-size="10.5" letter-spacing="1.4" fill="#4d5361">
      <text class="fade" x="26" y="114" style="animation-delay:.5s">PORTFOLIO QUALIFICATION</text>
      <text class="fade" x="26" y="130" style="animation-delay:.56s">RATE LIFTED · 6 LENDERS</text>
    </g>

    <!-- mini before/after bars -->
    <g>
      <rect x="272" y="62" width="90" height="9" rx="3" fill="#101116" fill-opacity=".08"/>
      <rect class="grow" x="272" y="62" width="27" height="9" rx="3" fill="#6366f1" fill-opacity=".45" style="animation-delay:.5s"/>
      <rect x="272" y="80" width="90" height="9" rx="3" fill="#101116" fill-opacity=".08"/>
      <rect class="grow" x="272" y="80" width="39" height="9" rx="3" fill="url(#mBar)" style="animation-delay:.7s"/>
      <text class="mono fade" x="272" y="106" font-size="9.5" letter-spacing="1" fill="#0e7490" style="animation-delay:1s">+13 PTS</text>
    </g>

    <rect class="grow" x="14" y="157" width="120" height="2" rx="1" fill="url(#mRule)" style="animation-delay:.9s"/>
  </g>

  <!-- ── TILE 2 · loan book exposure ───────────────────────── -->
  <g>
    <rect class="fade t2" x="407" y="0" width="386" height="160" rx="14" fill="#101116" fill-opacity=".022"/>
    <rect class="fade t2" x="407.75" y=".75" width="384.5" height="158.5" rx="13.25" fill="none" stroke="url(#mEdge)" stroke-width="1.5"/>

    <text class="mono fade t2" x="433" y="40" font-size="10.5" letter-spacing="1.6" fill="#0e7490">02 / PORTFOLIO</text>

    <g class="mono" font-size="34" font-weight="700" fill="#101116">
      <text class="tick" x="433" y="84" style="animation-delay:.62s">₹2B+</text>
      <text class="tick" x="433" y="84" style="animation-delay:.72s">₹4B+</text>
      <text class="tick" x="433" y="84" style="animation-delay:.82s">₹6B+</text>
      <text class="rise" x="433" y="84" style="animation-delay:.92s">₹8–9B+</text>
    </g>

    <g class="mono" font-size="10.5" letter-spacing="1.4" fill="#4d5361">
      <text class="fade t2" x="433" y="114" style="animation-delay:.62s">LOAN BOOK EXPOSURE</text>
      <text class="fade t2" x="433" y="130" style="animation-delay:.68s">MONITORED · 100K+ LOANS</text>
    </g>

    <!-- rising exposure sparkline -->
    <g transform="translate(679,0)">
      <path class="fade t2" d="M0 88 L18 80 L36 84 L54 68 L72 58 L90 46 L90 92 L0 92 Z" fill="url(#mArea)" style="animation-delay:.9s"/>
      <path class="draw" d="M0 88 L18 80 L36 84 L54 68 L72 58 L90 46" fill="none" stroke="#9333ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="420" style="animation-delay:.6s"/>
      <circle class="fade" cx="90" cy="46" r="3.5" fill="#0e7490" style="animation-delay:1.4s"/>
      <circle class="pulse" cx="90" cy="46" r="7" fill="none" stroke="#0e7490" stroke-opacity=".5" stroke-width="1.5"/>
      <text class="mono fade t2" x="0" y="108" font-size="9.5" letter-spacing="1" fill="#0e7490" style="animation-delay:1.4s">15+ DPD STAGES</text>
    </g>

    <rect class="grow" x="421" y="157" width="120" height="2" rx="1" fill="url(#mRule)" style="animation-delay:1s"/>
  </g>

  <!-- ── TILE 3 · automation ───────────────────────────────── -->
  <g>
    <rect class="fade t3" x="814" y="0" width="386" height="160" rx="14" fill="#101116" fill-opacity=".022"/>
    <rect class="fade t3" x="814.75" y=".75" width="384.5" height="158.5" rx="13.25" fill="none" stroke="url(#mEdge)" stroke-width="1.5"/>

    <text class="mono fade t3" x="840" y="40" font-size="10.5" letter-spacing="1.6" fill="#0e7490">03 / AUTOMATION</text>

    <g class="mono" font-size="34" font-weight="700" fill="#101116">
      <text class="tick" x="840" y="84" style="animation-delay:.74s">20%</text>
      <text class="tick" x="840" y="84" style="animation-delay:.84s">40%</text>
      <text class="tick" x="840" y="84" style="animation-delay:.94s">60%</text>
      <text class="tick" x="840" y="84" style="animation-delay:1.04s">75%</text>
      <text class="rise" x="840" y="84" style="animation-delay:1.14s">80%</text>
    </g>

    <g class="mono" font-size="10.5" letter-spacing="1.4" fill="#4d5361">
      <text class="fade t3" x="840" y="114" style="animation-delay:.74s">MANUAL VENDOR REVIEWS</text>
      <text class="fade t3" x="840" y="130" style="animation-delay:.8s">ELIMINATED VIA API ETL</text>
    </g>

    <!-- 80% donut -->
    <g transform="translate(1122,72)">
      <circle r="22" fill="none" stroke="#101116" stroke-opacity=".09" stroke-width="5"/>
      <circle class="ring" r="22" fill="none" stroke="url(#mBar)" stroke-width="5" stroke-linecap="round"
              stroke-dasharray="138.2" transform="rotate(-90)" style="animation-delay:.7s"/>
      <text class="mono fade" y="4" font-size="12" font-weight="700" fill="#0e7490" text-anchor="middle" style="animation-delay:1.5s">80</text>
      <text class="mono fade t3" y="46" font-size="9.5" letter-spacing="1" fill="#0e7490" text-anchor="middle" style="animation-delay:1.5s">−80% TOIL</text>
    </g>

    <rect class="grow" x="828" y="157" width="120" height="2" rx="1" fill="url(#mRule)" style="animation-delay:1.1s"/>
  </g>

  <!-- premium sheen sweep -->
  <g clip-path="url(#mTiles)">
    <rect class="sheen" x="0" y="-40" width="240" height="240" fill="url(#mSheen)" transform="skewX(-18)"/>
  </g>
</svg>
