name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Signal-themed snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: milanbeherazyx
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322d3ee
            dist/github-snake.svg?palette=github-light&color_snake=%236366f1

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
